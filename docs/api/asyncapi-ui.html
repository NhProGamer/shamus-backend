<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shamus WebSocket API Documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/@asyncapi/react-component@1/styles/default.min.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #fff;
        }
        #asyncapi {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .asyncapi__collapse-button {
            background: #6b5ce7 !important;
        }
        .asyncapi__channel-operation-badge--publish {
            background: #4caf50 !important;
        }
        .asyncapi__channel-operation-badge--subscribe {
            background: #2196f3 !important;
        }
        .header-nav {
            background: #333;
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-nav h1 {
            margin: 0;
            font-size: 1.2em;
        }
        .header-nav a {
            color: #6b5ce7;
            text-decoration: none;
        }
        .header-nav a:hover {
            text-decoration: underline;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>
    <nav class="header-nav">
        <h1>Shamus API Documentation</h1>
        <div class="nav-links">
            <a href="/docs/rest">REST API (OpenAPI)</a>
            <a href="/docs/ws">WebSocket API (AsyncAPI)</a>
        </div>
    </nav>
    <div id="asyncapi"></div>

    <script src="https://unpkg.com/@asyncapi/react-component@1/browser/standalone/index.js"></script>
    <script>
        // Fetch the AsyncAPI spec and render it
        fetch('/docs/api/asyncapi.yaml')
            .then(response => response.text())
            .then(schema => {
                AsyncApiStandalone.render({
                    schema: schema,
                    config: {
                        show: {
                            sidebar: true,
                            info: true,
                            servers: true,
                            operations: true,
                            messages: true,
                            schemas: true,
                            errors: true
                        },
                        expand: {
                            messageExamples: false
                        },
                        sidebar: {
                            showServers: 'byDefault',
                            showOperations: 'byDefault'
                        }
                    }
                }, document.getElementById('asyncapi'));
            })
            .catch(error => {
                document.getElementById('asyncapi').innerHTML = 
                    '<div style="padding: 40px; text-align: center; color: #d32f2f;">' +
                    '<h2>Error loading AsyncAPI specification</h2>' +
                    '<p>' + error.message + '</p>' +
                    '</div>';
            });
    </script>
</body>
</html>
